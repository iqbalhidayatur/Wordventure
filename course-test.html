<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wordventure final course test">
  <title>Final Test | Wordventure</title>
  <link rel="icon" type="image/png" href="assets/wordventure_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/course-test.css">
  <style>
    body, body * { font-family: var(--font-body); }
    h1, h2, h3, h4, h5, h6, .navbar-brand, .brand, .logo, .display-font { font-family: var(--font-heading); }
  </style>
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body class="learning-page page-transition">
  <main class="test-shell">
    <header class="test-topbar">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Back to courses"><i class="bi bi-arrow-left"></i></button>
      <a class="test-brand" href="learning.html"><img class="wv-wordmark" src="assets/wordventure.png" alt="Wordventure"></a>
      <div class="test-xp"><i class="bi bi-lightning-fill"></i><span id="xpValue">0 XP</span></div>
    </header>

    <section class="test-hero">
      <span class="eyebrow">Final assessment</span>
      <h1>Show what you learned.</h1>
      <p id="testIntro">Complete the final test for Travel English. You need 70% to pass.</p>
      <div class="test-stats">
        <span><i class="bi bi-question-circle-fill"></i> <strong id="questionCount">10</strong> questions</span>
        <span><i class="bi bi-award-fill"></i> 70% to pass</span>
        <span><i class="bi bi-lightning-charge-fill"></i> +100 XP</span>
      </div>
    </section>

    <section class="test-card" aria-live="polite">
      <div class="test-progress-row">
        <span id="questionProgress">Question 1 of 10</span>
        <strong id="scorePreview">0 correct</strong>
      </div>
      <div class="test-progress"><span id="progressBar"></span></div>

      <div id="questionArea"></div>

      <div class="test-feedback" id="feedback" hidden></div>

      <div class="test-actions">
        <button class="secondary-btn" id="backQuestionBtn" type="button" disabled>Previous</button>
        <button class="primary-btn" id="nextBtn" type="button" disabled>Check answer <i class="bi bi-check2"></i></button>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/course-test.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
